name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches app version
        shell: bash
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "v$app_version" = "$GITHUB_REF_NAME"

      - name: Determine release signing mode
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "Missing required GitHub Actions secret: SPARKLE_PRIVATE_KEY" >&2
            exit 1
          fi

          apple_secrets=(
            DEVELOPER_ID_P12_BASE64
            DEVELOPER_ID_P12_PASSWORD
            DEVELOPER_ID_APPLICATION
            APP_STORE_CONNECT_API_KEY_BASE64
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
          )
          present=0
          for name in "${apple_secrets[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            fi
          done

          if (( present == 0 )); then
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing an ad-hoc signed, unnotarized build. Users may need Open Anyway."
          elif (( present == ${#apple_secrets[@]} )); then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple signing secrets are only partially configured. Add all six or remove all six." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.notarize == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/whisp-build.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep -F "$DEVELOPER_ID_APPLICATION"

          rm -f "$certificate_path"
          echo "WHISP_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build release archive
        env:
          WHISP_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        shell: bash
        run: |
          if [[ -z "${WHISP_SIGN_IDENTITY:-}" ]]; then
            export WHISP_SIGN_IDENTITY="-"
          fi
          ./Scripts/test-core.sh
          ./Scripts/package-release.sh

      - name: Notarize and staple release archive
        if: steps.signing.outputs.notarize == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          archive="release/Whisp-$version.dmg"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$api_key_path"' EXIT

          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          xcrun notarytool submit "$archive" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$archive"
          xcrun stapler validate "$archive"
          codesign --verify --verbose=2 "$archive"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "$archive"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          cp RELEASE_NOTES.md "release/Whisp-$version.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
              --embed-release-notes \
              --link "https://github.com/$GITHUB_REPOSITORY" \
              release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          cp "release/Whisp-$version.dmg" release/Whisp.dmg
          gh release create "$GITHUB_REF_NAME" \
            release/Whisp-*.dmg \
            release/Whisp.dmg \
            release/appcast.xml \
            --title "Whisp $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md

      - name: Delete temporary signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${WHISP_KEYCHAIN_PATH:-}" && -f "$WHISP_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$WHISP_KEYCHAIN_PATH"
          fi
