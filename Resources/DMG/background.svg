<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1130" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2233"/>
      <stop offset="0.5" stop-color="#0D111B"/>
      <stop offset="1" stop-color="#08090F"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientTransform="translate(300 315) rotate(38) scale(520 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BDFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4BDFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientTransform="translate(965 575) rotate(-145) scale(500 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D27CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D27CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="490" y1="380" x2="710" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6CE8FF"/>
      <stop offset="1" stop-color="#DA93FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="468" y1="313" x2="732" y2="447" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <filter id="arrowGlow" x="440" y="270" width="320" height="220" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#background)"/>
  <rect width="1200" height="800" fill="url(#leftGlow)"/>
  <rect width="1200" height="800" fill="url(#rightGlow)"/>
  <path d="M1 1H1199V799H1V1Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <text x="600" y="90" text-anchor="middle" fill="#F8F9FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="680">Install Whisp</text>
  <text x="600" y="133" text-anchor="middle" fill="#C5CAD9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24">Drag Whisp into the Applications folder</text>

  <!-- Actual Finder icons sit at (350, 380) and (850, 380). Keep both 200px icon areas clear. -->
  <circle cx="350" cy="380" r="130" fill="none" stroke="#72E5FF" stroke-opacity="0.13" stroke-width="2"/>
  <circle cx="850" cy="380" r="130" fill="none" stroke="#D397FF" stroke-opacity="0.13" stroke-width="2"/>

  <rect x="468" y="313" width="264" height="134" rx="67" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M500 380H692M655 343L697 380L655 417" fill="none" stroke="url(#arrow)" stroke-opacity="0.45" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)"/>
  <path d="M500 380H692M655 343L697 380L655 417" fill="none" stroke="url(#arrow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="500" text-anchor="middle" fill="#DCE0EC" fill-opacity="0.72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" letter-spacing="3">DRAG TO INSTALL</text>
  <path d="M270 600H930" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <text x="600" y="660" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20">Then open Whisp from your Applications folder</text>
  <text x="600" y="708" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">Double-tap Control · Speak · Done</text>
</svg>
